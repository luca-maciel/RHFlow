spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rhflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# MongoDB (Auditoria)
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/rhflow_audit}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Upload de Documentos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.documents-dir=uploads/documentos

# E-mail (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}

# Super Admin Inicial (Data Seeder)
app.admin.name=${ADMIN_NAME:Administrador RHFlow}
app.admin.email=${ADMIN_EMAIL:admin@rhflow.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Massa de dados de demonstração (executa apenas se o banco estiver vazio)
app.demo-seed.enabled=true